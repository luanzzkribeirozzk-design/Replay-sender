name: Build APK - Sender

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version=8.4

      - name: Restaurar keystore de release
        env:
          RXS_KEYSTORE_B64: ${{ secrets.RXS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RXS_KEYSTORE_B64" || { echo "RXS_KEYSTORE_B64 não configurado." >&2; exit 1; }
          printf '%s' "$RXS_KEYSTORE_B64" | base64 --decode > app/replayx-sender-release.jks
          test -s app/replayx-sender-release.jks
          echo "Keystore restaurada em caminho temporário."

      - name: Build APK release assinado
        env:
          RXS_KEYSTORE_PATH: replayx-sender-release.jks
          RXS_KEYSTORE_PASSWORD: ${{ secrets.RXS_KEYSTORE_PASSWORD }}
          RXS_KEY_ALIAS: ${{ secrets.RXS_KEY_ALIAS }}
          RXS_KEY_PASSWORD: ${{ secrets.RXS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RXS_KEYSTORE_PASSWORD" || { echo "RXS_KEYSTORE_PASSWORD não configurado." >&2; exit 1; }
          test -n "$RXS_KEY_ALIAS" || { echo "RXS_KEY_ALIAS não configurado." >&2; exit 1; }
          test -n "$RXS_KEY_PASSWORD" || { echo "RXS_KEY_PASSWORD não configurado." >&2; exit 1; }
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          echo "APK release do Sender gerado com sucesso."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReplayX-Sender-APK-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
