plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.replayx.sender'
    compileSdk 34

    defaultConfig {
        applicationId "com.replayx.sender"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "2.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("RXS_KEYSTORE_PATH")
            if (ksPath != null && ksPath.trim().length() > 0) {
                storeFile file(ksPath)
                storePassword System.getenv("RXS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RXS_KEY_ALIAS")
                keyPassword System.getenv("RXS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksp = System.getenv("RXS_KEYSTORE_PATH")
            if (ksp != null && ksp.trim().length() > 0) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled true
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.zxing:core:3.5.3'
}
